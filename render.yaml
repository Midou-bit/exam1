                destination: /index.html
            headers:
              - path: /*
                name: X-Frame-Options
                value: DENY
              - path: /*
                name: X-Content-Type-Options
                value: nosniff
              - path: /*
                name: Referrer-Policy
                value: strict-origin-when-cross-origin
          - name: midou-exam1-prod-backend
            type: web
            runtime: docker
            plan: free
            region: frankfurt
            branch: main
            dockerfilePath: ./backend/Dockerfile
            dockerContext: ./backend
            healthCheckPath: /health
            autoDeployTrigger: checksPass
            buildFilter:
              paths:
                - backend/**
            envVars:
              - fromGroup: midou-exam1-prod-internal
              - key: NODE_ENV
                value: production
              - key: APP_ENV
                value: prod
              - key: LOG_LEVEL
                value: info
              - key: MONGO_URI
                sync: false
              - key: JWT_SECRET
                generateValue: true
              - key: GATEWAY_URL
                value: https://midou-exam1-prod-gateway.onrender.com
              - key: CORS_ORIGIN
                value: https://midou-exam1-prod-frontend.onrender.com
              - key: NOTIFY_ADMIN_EMAIL
                sync: false
          - name: midou-exam1-prod-gateway
            type: web
            runtime: docker
            plan: free
            region: frankfurt
            branch: main
            dockerfilePath: ./gateway/Dockerfile
            dockerContext: ./gateway
            healthCheckPath: /health
            autoDeployTrigger: checksPass
            buildFilter:
              paths:
                - gateway/**
            envVars:
              - fromGroup: midou-exam1-prod-internal
              - key: NODE_ENV
                value: production
              - key: APP_ENV
                value: prod
              - key: LOG_LEVEL
                value: info
              - key: NOTIFI_SERVICE_URL
                value: https://midou-exam1-prod-notifications.onrender.com
              - key: STOCK_SERVICE_URL
                value: https://midou-exam1-prod-stock-management.onrender.com
          - name: midou-exam1-prod-notifications
            type: web
            runtime: docker
            plan: free
            region: frankfurt
            branch: main
            dockerfilePath: ./microservices/notifications/Dockerfile
            dockerContext: ./microservices/notifications
            healthCheckPath: /health
            autoDeployTrigger: checksPass
            buildFilter:
              paths:
                - microservices/notifications/**
            envVars:
              - fromGroup: midou-exam1-prod-internal
              - key: NODE_ENV
                value: production
              - key: APP_ENV
                value: prod
              - key: LOG_LEVEL
                value: info
              - key: EMAIL_USER
                sync: false
              - key: EMAIL_APPLICATION_PASSWORD
                sync: false
          - name: midou-exam1-prod-stock-management
            type: web
            runtime: docker
            plan: free
            region: frankfurt
            branch: main
            dockerfilePath: ./microservices/stock-management/Dockerfile
            dockerContext: ./microservices/stock-management
            healthCheckPath: /health
            autoDeployTrigger: checksPass
            buildFilter:
              paths:
                - microservices/stock-management/**
            envVars:
              - fromGroup: midou-exam1-prod-internal
              - key: NODE_ENV
                value: production
              - key: APP_ENV
                value: prod
              - key: LOG_LEVEL
                value: info
