# Sert le build React ; toutes les routes inconnues renvoient index.html (fallback SPA : /cart, /admin...)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Fichiers versionnés par le build : cache long
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
