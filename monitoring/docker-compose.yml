# Supervision (Uptime Kuma), séparée du compose de l'application
# Lancement : docker compose -f monitoring/docker-compose.yml up -d  → http://localhost:3001
services:
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    ports:
      - '3001:3001'
    volumes:
      - uptime-kuma-data:/app/data
    restart: unless-stopped

volumes:
  uptime-kuma-data:
    name: uptime-kuma-data
